apiVersion: v1
kind: Service
metadata:
  name: foreshy-app-service
  labels:
    app: foreshy
spec:
  type: LoadBalancer
  selector:
    app: foreshy
  ports:
  - name: http
    protocol: TCP
    port: 80          # 외부(브라우저, Postman)에서 접속할 포트
    targetPort: 3000  # deployment.yaml의 containerPort(3000)와 일치